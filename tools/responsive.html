<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Responsive layout preview</title><style>body{margin:0;background:#d5d8d2;font:12px sans-serif}p{margin:8px;text-align:center}iframe{border:0;display:block;margin:auto;background:#f5f3ec;box-shadow:0 0 10px #0002}</style></head><body><p id="label">Responsive layout preview</p><pre id="report" style="white-space:pre-wrap;text-align:center;font-size:10px"></pre><iframe title="Website preview" width="390" height="880" src="/"></iframe><script>const q=new URLSearchParams(location.search);const frame=document.querySelector('iframe');const width=Number(q.get('width'));if([320,390,600,768,1024].includes(width))frame.width=width;const path=q.get('path');if(path&&/^\/(?:(?:same-same-game|nearcoil-game|timeline-exporter|cinelace-app)\/(?:[a-zA-Z0-9_-]+\/)*(?:[a-zA-Z0-9_-]+\.html)?)?$/.test(path))frame.src=path;document.querySelector('#label').textContent=frame.width+'px — '+frame.getAttribute('src');frame.addEventListener('load',()=>{const d=frame.contentDocument;const width=frame.contentWindow.innerWidth;const images=[...d.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.getAttribute('src'));document.querySelector('#report').textContent=JSON.stringify({width,scrollWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>width,missingImages:images});});</script></body></html>
